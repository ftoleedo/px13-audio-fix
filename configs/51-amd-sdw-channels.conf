# Optional: force FL/FR positions on the SoundWire pro-audio output node.
# The node name embeds the ACP PCI address, which is not the same on every
# machine, so match it with a regex ("~" prefix) instead of a literal.
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output\\..*amd_sdw\\.pro-output-.*"
      }
    ]
    actions = {
      update-props = {
        audio.position = [ "FL", "FR" ]
      }
    }
  }
]
